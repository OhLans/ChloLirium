<div class="regex-script-label">
    <div class="chlo-regex-row">
        <input type="checkbox" class="regex_bulk_checkbox">
        <span class="drag-handle menu-handle" title="Drag to change run order" aria-hidden="true"><i class="fa-solid fa-grip-vertical"></i></span>
        <button type="button" class="edit_existing_regex regex_script_name" aria-expanded="false"></button>
        <span class="chlo-regex-scope-label"></span>
        <button type="button" class="chlo-regex-switch disable_regex" role="switch" aria-checked="false"></button>
        <button type="button" class="chlo-regex-icon-button chlo-regex-order-button" data-regex-action="script-up" aria-label="Move script up"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
        <button type="button" class="chlo-regex-icon-button chlo-regex-order-button" data-regex-action="script-down" aria-label="Move script down"><i class="fa-solid fa-arrow-down" aria-hidden="true"></i></button>
        <button type="button" class="chlo-regex-icon-button chlo-regex-row-tools" aria-label="Script tools" aria-expanded="false"><i class="fa-solid fa-ellipsis" aria-hidden="true"></i></button>
    </div>
    <div class="chlo-regex-row-actions" hidden>
        <label class="chlo-regex-section-field">
            Section
            <select class="chlo-regex-section-select text_pole"></select>
        </label>
        <div class="chlo-regex-row-buttons">
            <button type="button" class="move_to_global menu_button" data-i18n="ext_regex_move_to_global">Move to global scripts</button>
            <button type="button" class="move_to_preset menu_button" data-i18n="ext_regex_move_to_preset">Move to preset scripts</button>
            <button type="button" class="move_to_scoped menu_button" data-i18n="ext_regex_move_to_scoped">Move to character scripts</button>
            <button type="button" class="export_regex menu_button" data-i18n="Export">Export</button>
            <button type="button" class="delete_regex menu_button" data-i18n="Delete">Delete</button>
        </div>
    </div>
</div>
