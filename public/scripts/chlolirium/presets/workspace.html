<section id="chlo-preset-workspace" class="pw" role="dialog" aria-modal="false" aria-labelledby="pw-title" hidden>
    <header class="pw-header">
        <div class="pw-heading"><span class="pw-eyebrow">CHLOLIRIUM · YOUR WRITING SPACE</span><h2 id="pw-title">Preset Library</h2><p id="pw-subtitle">Your collection, ready to write.</p></div>
        <div class="pw-header-actions">
            <button type="button" data-action="dock" title="Keep the chat visible" aria-label="Toggle docked view"><i class="fa-solid fa-columns" aria-hidden="true"></i></button>
            <button type="button" data-action="close" aria-label="Close preset workspace" title="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
    </header>
    <nav class="pw-tabs" aria-label="Preset workspace">
        <button type="button" data-view="library" aria-current="page"><i class="fa-solid fa-book-open" aria-hidden="true"></i> Presets</button>
        <button type="button" data-view="editor"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> Blocks</button>
        <button type="button" data-view="parameters"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Parameters</button>
    </nav>
    <div class="pw-status" role="status" aria-live="polite"></div>
    <div id="pw-library" class="pw-view">
        <div class="pw-toolbar">
            <label class="pw-search"><i class="fa-solid fa-search" aria-hidden="true"></i><input id="pw-search" type="search" placeholder="Search your presets…" aria-label="Search presets"></label>
            <div class="pw-filters" role="group" aria-label="Filter presets"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="favorites" aria-pressed="false">Favorites</button><button type="button" data-filter="recent" aria-pressed="false">Recent</button></div>
            <button type="button" data-action="import"><i class="fa-solid fa-file-import" aria-hidden="true"></i> Import</button>
            <button type="button" class="pw-primary" data-action="new"><i class="fa-solid fa-plus" aria-hidden="true"></i> New preset</button>
        </div>
        <div class="pw-collection"><div id="pw-preset-list" aria-label="Preset collection"></div><article id="pw-preset-details" aria-label="Selected preset"></article></div>
    </div>
    <div id="pw-editor" class="pw-view" hidden>
        <div class="pw-toolbar pw-editor-toolbar"><button type="button" data-view="library">← Back to library</button><span id="pw-draft-state" class="pw-muted"></span><div class="pw-spacer"></div><button type="button" data-action="export">Export</button><button type="button" data-action="save"><i class="fa-solid fa-save" aria-hidden="true"></i> Save preset</button><button type="button" class="pw-primary" data-action="use-draft"><i class="fa-solid fa-play" aria-hidden="true"></i> Use in chat</button></div>
        <div class="pw-block-workspace">
            <aside class="pw-block-sidebar"><div class="pw-block-tools"><input id="pw-block-search" type="search" placeholder="Find a block…" aria-label="Search blocks"><button type="button" data-action="add-block" aria-label="Add block" title="Add block"><i class="fa-solid fa-plus" aria-hidden="true"></i></button></div><div id="pw-block-list"></div></aside>
            <article id="pw-block-editor"></article>
        </div>
    </div>
    <div id="pw-parameters" class="pw-view" hidden>
        <p class="pw-shared-note"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Shared generation settings. Changes save automatically and stay in place when you switch presets.</p>
        <div id="pw-parameter-controls"></div>
    </div>
    <input id="pw-import-file" type="file" accept=".json,.settings,application/json" hidden>
    <input id="pw-cover-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
</section>
